services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d tickets"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  seller1:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tickets
    depends_on:
      db: {condition: service_healthy}

  seller2:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tickets
    depends_on:
      db: {condition: service_healthy}

  seller3:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tickets
    depends_on:
      db: {condition: service_healthy}

  naive:
    build: .
    command: ["uvicorn","app.naive:app","--host","0.0.0.0","--port","8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tickets
      NAIVE_DELAY: "0.005"
    depends_on:
      db: {condition: service_healthy}

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [seller1,seller2,seller3]

  # Separate naive port for the required failing experiment.
  naive_proxy:
    image: nginx:1.29-alpine
    ports:
      - "8001:80"
    volumes:
      - ./nginx/naive.conf:/etc/nginx/nginx.conf:ro
    depends_on: [naive]

volumes:
  pgdata:
